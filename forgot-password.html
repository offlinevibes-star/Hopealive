<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | HopeAlive</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: Arial, sans-serif; background: #f3f6f4; }
    .card { width: min(100%, 410px); padding: 30px; background: #fff; border-radius: 14px; box-shadow: 0 8px 30px #00000012; }
    h1 { margin-top: 0; color: #176b45; font-size: 25px; }
    p { color: #4b5563; line-height: 1.5; }
    input, button { width: 100%; padding: 13px; margin-top: 12px; border-radius: 7px; font-size: 16px; }
    input { border: 1px solid #cbd5d1; }
    button { border: 0; color: white; background: #176b45; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { overflow-wrap: anywhere; }
    a { color: #176b45; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Reset your password</h1>
    <p>Enter the email address associated with your HopeAlive admin account. If the account exists, Supabase will send a password-reset link.</p>
    <form id="resetForm">
      <input id="email" type="email" value="hopekalu01@gmail.com" autocomplete="email" required>
      <button id="submitBtn" type="submit">Send reset link</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="admin.html">Return to admin login</a></p>
  </main>
  <script>
    const SUPABASE_URL = "https://thnrxtxhkmfqnoooqcwc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9Rdbl86dfIb00Z32M5VOEQ_gjqRODYk";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Sending...";
      message.textContent = "";
      try {
        const email = document.getElementById("email").value.trim();
        const { error } = await db.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              "https://offlinevibes-star.github.io/Hopealive/reset-password.html"
          }
        );
        if (error) throw error;
        message.textContent = "If this email belongs to an account, a recovery link will be sent. Check your inbox and spam folder.";
      } catch (error) {
        message.textContent = "Could not send the reset link: " + (error.message || "Please try again later.");
      } finally {
        button.disabled = false;
        button.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
