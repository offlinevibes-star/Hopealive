</style></head><body><main class="ad"><div class="bar"><div><h1 style="font-size:34px">HopeAlive Admin</h1><p class="muted">Secure administration</p></div><div id="userbox"></div></div><p id="status" class="status" role="status"></p><section id="login" class="panel"><h2>Administrator sign in</h2><p class="muted">Use the email address invited in Supabase Authentication.</p><form id="loginform"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="b primary">Sign in</button></form><p class="muted" style="margin-top:14px"><a href="forgot-password.html">Forgot your password?</a></p></section><section id="workspace" class="hidden"><nav class="tabs"><button class="b active" data-tab="messages">Messages</button><button class="b" data-tab="posts">Posts</button><button class="b" data-tab="media">Media library</button><button class="b" data-tab="settings">Settings</button><button class="b" data-tab="donations">Donations</button><button class="b" data-tab="activity">Activity log</button></nav><div id="messages" class="panel"></div><div id="posts" class="panel hidden"></div><div id="media" class="panel hidden"></div><div id="settings" class="panel hidden"></div><div id="donations" class="panel hidden"></div><div id="activity" class="panel hidden"></div></section></main>

const db=supabase.createClient('https://thnrxtxhkmfqnoooqcwc.supabase.co','sb_publishable_9Rdbl86dfIb00Z32M5VOEQ_gjqRODYk'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),say=t=>$('#status').textContent=t;
let tab='messages',postRows=[];
async function authCheck(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.rpc('is_hopealive_admin');if(error)throw error;return data===true}
async function enter(){if(!await authCheck()){await db.auth.signOut();throw Error('This account is not authorised in the HopeAlive admin allow-list.')}$('#login').classList.add('hidden');$('#workspace').classList.remove('hidden');$('#userbox').innerHTML='<a class="b" href="supabase-migrate.html">Import old website data</a> <button class="b" id="logout">Sign out</button>';$('#logout').onclick=async()=>{const button=$('#logout');button.disabled=true;const auditPromise=db.rpc('record_admin_auth_event',{p_action:'logout'}).then(({error})=>{if(error)console.warn('Logout audit event could not be saved.')}).catch(()=>console.warn('Logout audit event could not be saved.'));let signoutError=null;try{const {error}=await db.auth.signOut({scope:'local'});if(error)signoutError=error}catch(e){signoutError=e}finally{$('#workspace').classList.add('hidden');$('#login').classList.remove('hidden');$('#userbox').innerHTML='';say(signoutError?'Signed out locally; remote session revocation could not be confirmed.':'Signed out.')}await Promise.race([auditPromise,new Promise(resolve=>setTimeout(resolve,750))]);if(signoutError)console.warn('Local sign-out returned an error.',signoutError);location.reload()};show('messages')}
function show(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));['messages','posts','media','settings','donations','activity'].forEach(k=>$('#'+k).classList.toggle('hidden',k!==t));load(t)}
async function load(t){say('Loading…');try{if(t==='messages')await loadMessages();if(t==='posts')await loadPosts();if(t==='media')await loadMedia();if(t==='settings')await loadSettings();if(t==='donations')await loadDonations();if(t==='activity')await loadActivity();say('')}catch(e){say('Error: '+e.message)}}

const MEDIA_BUCKET='hopealive-media',PRIVATE_MEDIA_BUCKET='hopealive-private-media',MAX_MEDIA_BYTES=50*1024*1024;
const MEDIA_CATEGORIES=['Child protection','Education','Healing through the arts','Sustainable community development','Youth empowerment','Events & activities','General'];
const categoryOptions=(chosen,auto)=>((auto?'<option value="auto" '+(chosen==='auto'?'selected':'')+'>Auto-detect from filename</option>':'')+MEDIA_CATEGORIES.map(c=>'<option value="'+esc(c)+'" '+(chosen===c?'selected':'')+'>'+esc(c)+'</option>').join(''));
function guessCategory(filename){const n=String(filename||'').toLowerCase();if(/menstr|school|book|class|learn|teach|teacher|parent|summit|education|student|literacy|treasure based|back to school|stella maris|community secondary/.test(n))return 'Education';if(/sport|music|dance|drama|art|paint|healing|creative|games day/.test(n))return 'Healing through the arts';if(/child|protect|safety|safe|care/.test(n))return 'Child protection';if(/youth|empower|skill|training|career|mentorship|teenager|girls|what next|conference|volunteer/.test(n))return 'Youth empowerment';if(/community|solar|water|farm|development|village/.test(n))return 'Sustainable community development';return 'Events & activities'}
async function expandMediaSelection(selected){const out=[];let total=0;for(const picked of selected){if(!picked.name.toLowerCase().endsWith('.zip')&&picked.type!=='application/zip'&&picked.type!=='application/x-zip-compressed'){out.push(picked);continue}if(!window.JSZip)throw Error('ZIP support did not load. Refresh the page and try again.');const archive=await JSZip.loadAsync(picked);const entries=Object.values(archive.files).filter(x=>{if(x.dir)return false;const parts=x.name.split('/');if(parts.some(part=>part.startsWith('.')||part==='__MACOSX'))return false;return ['jpg','jpeg','png','webp','gif','mp4','webm','mov'].includes((parts[parts.length-1].split('.').pop()||'').toLowerCase())});for(const entry of entries){const ext=entry.name.split('.').pop().toLowerCase(),mime=({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime'})[ext];const size=entry._data&&entry._data.uncompressedSize||0;if(size>MAX_MEDIA_BYTES)throw Error(entry.name+' exceeds the 50 MB per-file limit.');total+=size;if(total>300*1024*1024)throw Error('This ZIP expands beyond the 300 MB batch limit.');const blob=await entry.async('blob');out.push(new File([blob],entry.name.split('/').pop(),{type:mime,lastModified:Date.now()}));if(out.length>250)throw Error('This batch contains more than 250 media files.')}}return out}async function uploadToStorage(file,category,bucket=MEDIA_BUCKET){if(!['image/jpeg','image/png','image/webp','image/gif','video/mp4','video/webm','video/quicktime'].includes(file.type))throw Error('Unsupported file type. Use JPEG, PNG, WebP, GIF, MP4, WebM or MOV: '+file.name);if(file.size>MAX_MEDIA_BYTES)throw Error(file.name+' is larger than 50 MB. Please compress it before uploading.');const ext=(file.name.split('.').pop()||'file').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8)||'file';const folder=String(category||'media').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'media';const path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,10)+'.'+ext;const {data,error}=await db.storage.from(bucket).upload(path,file,{cacheControl:'31536000',contentType:file.type,upsert:false});if(error)throw error;const url=bucket===MEDIA_BUCKET?db.storage.from(bucket).getPublicUrl(data.path).data.publicUrl:null;return {bucket,path,url,type:file.type.startsWith('video/')?'video':'image',mime_type:file.type,size_bytes:file.size,filename:file.name}}
async function loadActivity(){const {data,error}=await db.from('admin_activity_logs').select('id,actor_id,action,table_name,record_id,summary,created_at').order('created_at',{ascending:false}).limit(100);if(error)throw error;$('#activity').innerHTML='<h2>Administrator activity</h2><p class="muted">Latest 100 administrative record changes. Sensitive field values are not included.</p>'+(data&&data.length?data.map(x=>'<article class="item"><div class="bar"><b>'+esc(x.action)+' · '+esc(x.table_name)+'</b><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span></div><p>'+esc(x.summary)+'</p><small class="muted">Record: '+esc(x.record_id||'—')+' · Admin: '+esc(x.actor_id||'system')+'</small></article>').join(''):'<p>No activity recorded yet.</p>')}
async function loadMessages(){const {data,error}=await db.from('contact_messages').select('*').order('created_at',{ascending:false});if(error)throw error;$('#messages').innerHTML='<h2>Contact messages ('+data.length+')</h2>'+(data.map(m=>'<article class="item"><div class="bar"><b>'+esc(m.sender_name)+'</b><span class="muted">'+new Date(m.created_at).toLocaleString()+'</span></div><p><a href="mailto:'+esc(m.sender_email)+'">'+esc(m.sender_email)+'</a></p><p style="white-space:pre-wrap">'+esc(m.message)+'</p><button class="b" data-read="'+m.id+'">'+(m.is_read?'Read':'Mark as read')+'</button> <button class="b danger" data-delmsg="'+m.id+'">Delete</button></article>').join('')||'<p>No messages yet.</p>');$('#messages').querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{const {error}=await db.from('contact_messages').update({is_read:true}).eq('id',b.dataset.read);if(error)say(error.message);else loadMessages()});$('#messages').querySelectorAll('[data-delmsg]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this message?')){const {error}=await db.from('contact_messages').delete().eq('id',b.dataset.delmsg);if(error)say(error.message);else loadMessages()}})}
async function loadPosts(){const {data,error}=await db.from('posts').select('*').order('published_at',{ascending:false});if(error)throw error;postRows=data;$('#posts').innerHTML='<div class="bar"><h2>Blog posts</h2><button class="b primary" id="newpost">New post</button></div><div id="plist">'+data.map(p=>'<div class="item bar"><span><b>'+esc(p.title)+'</b><br><small class="muted">'+(p.is_draft?'Draft':'Published')+' · '+esc(p.published_at||'')+'</small></span><span><button class="b" data-edit="'+p.id+'">Edit</button> <button class="b danger" data-rmp="'+p.id+'">Delete</button></span></div>').join('')+'</div><div id="pform" class="hidden"></div>';$('#newpost').onclick=()=>editPost(null);$('#posts').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPost(postRows.find(p=>p.id===b.dataset.edit)));$('#posts').querySelectorAll('[data-rmp]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this post and its uploaded attachments?')){const post=postRows.find(p=>p.id===b.dataset.rmp),{error}=await db.from('posts').delete().eq('id',b.dataset.rmp);if(error){say(error.message);return}for(const item of (post&&Array.isArray(post.media)?post.media:[]))if(item.path){try{await hopeCleanupDetachedObject(item.bucket||MEDIA_BUCKET,item.path)}catch(cleanupError){say('Post deleted; attachment cleanup is pending: '+cleanupError.message)}}say('Post and attachments deleted.');loadPosts()}})}
function editPost(p){
const f=$('#pform'),initialMedia=Array.isArray(p&&p.media)?p.media:[];let postMedia=initialMedia.map(m=>({...m,bucket:m.bucket||MEDIA_BUCKET})),removedPostMedia=[];
f.classList.remove('hidden');
f.innerHTML='<h3>'+(p?'Edit post':'New post')+'</h3><form id="pf"><div class="grid"><label>Title<input name="title" required value="'+esc(p?.title||'')+'"></label><label>Slug<input name="slug" required value="'+esc(p?.slug||'')+'"></label><label>Date<input name="date" type="date" value="'+esc(p?.published_at||new Date().toISOString().slice(0,10))+'"></label><label>Category<input name="category" value="'+esc(p?.category||'News')+'"></label><label>Author<input name="author" value="'+esc(p?.author||'HopeAlive Foundation')+'"></label><label>Featured image URL<input name="image" value="'+esc(p?.featured_image||'')+'"></label></div><label>Excerpt<textarea name="excerpt">'+esc(p?.excerpt||'')+'</textarea></label><label>Tags, separated by commas<input name="tags" value="'+esc((p?.tags||[]).join(', '))+'"></label><label>Body HTML<textarea name="body">'+esc(p?.body_html||'')+'</textarea></label><h3>Photos and videos in this post</h3><p class="muted">Attach images or MP4, WebM and MOV videos. Each file can be up to 50 MB. Attachments are public by URL, so only use media approved for publication.</p><label>Add photos/videos<input id="post-media-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" multiple></label><div id="post-media-list" class="media-grid"></div><p id="post-media-status" class="muted" role="status"></p><label><span><input type="checkbox" name="draft" style="width:auto" '+(p?.is_draft?'checked':'')+'> Save as draft</span></label><button class="b primary">Save</button> <button type="button" class="b" id="cancelp">Cancel</button></form>';
const renderPostMedia=async()=>{const cards=await Promise.all(postMedia.map(async(m,i)=>{let preview=m.url;if(m.bucket===PRIVATE_MEDIA_BUCKET){const {data:signed,error}=await db.storage.from(PRIVATE_MEDIA_BUCKET).createSignedUrl(m.path,300);if(error)throw error;preview=signed.signedUrl}return '<article class="media-card">'+(m.type==='video'?'<video class="media-preview" controls src="'+esc(preview||'')+'"></video>':'<img class="media-preview" src="'+esc(preview||'')+'" alt="">')+'<p class="muted">'+esc(m.caption||'Attachment')+'</p><button type="button" class="b danger" data-remove-post-media="'+i+'">Remove</button></article>'}));$('#post-media-list').innerHTML=cards.join('')||'<p class="muted">No attachments yet.</p>';$('#post-media-list').querySelectorAll('[data-remove-post-media]').forEach(b=>b.onclick=()=>{removedPostMedia.push(postMedia.splice(+b.dataset.removePostMedia,1)[0]);renderPostMedia()})};
renderPostMedia();
$('#cancelp').onclick=()=>f.classList.add('hidden');
$('#post-media-files').onchange=async e=>{const files=Array.from(e.target.files||[]),status=$('#post-media-status');for(const file of files){try{status.textContent='Uploading '+file.name+'…';const asset=await uploadToStorage(file,$('#pf [name="category"]').value||'Posts',PRIVATE_MEDIA_BUCKET);postMedia.push({url:null,path:asset.path,bucket:PRIVATE_MEDIA_BUCKET,type:asset.type,mime_type:asset.mime_type,caption:file.name});await renderPostMedia();status.textContent='Uploaded '+file.name}catch(err){status.textContent='Could not upload '+file.name+': '+err.message}}e.target.value=''};
$('#pf').onsubmit=async e=>{e.preventDefault();const x=new FormData(e.target),draft=x.has('draft'),targetBucket=draft?PRIVATE_MEDIA_BUCKET:MEDIA_BUCKET,moved=[];let finalMedia=[];try{for(const m of postMedia){const oldBucket=m.bucket||MEDIA_BUCKET;if(oldBucket===targetBucket){finalMedia.push({...m,bucket:targetBucket,url:targetBucket===MEDIA_BUCKET?(m.url||db.storage.from(MEDIA_BUCKET).getPublicUrl(m.path).data.publicUrl):null});continue}const {data:blob,error:de}=await db.storage.from(oldBucket).download(m.path);if(de)throw de;const {data:up,error:ue}=await db.storage.from(targetBucket).upload(m.path,blob,{contentType:m.mime_type,cacheControl:'31536000',upsert:false});if(ue)throw ue;const url=targetBucket===MEDIA_BUCKET?db.storage.from(MEDIA_BUCKET).getPublicUrl(up.path).data.publicUrl:null;finalMedia.push({...m,bucket:targetBucket,path:up.path,url});moved.push({from:oldBucket,to:targetBucket,path:up.path,oldPath:m.path})}const row={title:x.get('title').trim(),slug:x.get('slug').trim().toLowerCase(),published_at:x.get('date')||null,category:x.get('category').trim()||'News',author:x.get('author').trim()||'HopeAlive Foundation',featured_image:x.get('image').trim(),excerpt:x.get('excerpt').trim(),tags:x.get('tags').split(',').map(v=>v.trim()).filter(Boolean),body_html:x.get('body'),media:finalMedia,is_draft:draft,updated_at:new Date().toISOString()};const q=p?db.from('posts').update(row).eq('id',p.id):db.from('posts').insert(row);const {error}=await q;if(error)throw error;for(const item of moved){try{await hopeCleanupDetachedObject(item.from,item.oldPath)}catch(cleanupError){say('Post saved; old attachment cleanup is pending: '+cleanupError.message)}}for(const item of removedPostMedia)if(item&&item.path){try{await hopeCleanupDetachedObject(item.bucket||MEDIA_BUCKET,item.path)}catch(cleanupError){say('Post saved; attachment cleanup is pending: '+cleanupError.message)}}say('Post saved.');loadPosts()}catch(err){say('Could not save post: '+err.message+'. Any copied media objects were preserved for integrity review; run the media scan before cleanup.')}}
}
async function loadSettings(){const {data,error}=await db.from('site_settings').select('settings').eq('id',1).single();if(error)throw error;$('#settings').innerHTML='<h2>Website settings</h2><p class="muted">All settings saved here are public website content and can be read by visitors. Never put passwords, API secrets, private contact details or service-role keys here. Keep the existing field structure and only change verified public details.</p><label>Settings JSON<textarea id="sj" style="min-height:400px;font-family:monospace">'+esc(JSON.stringify(data.settings||{},null,2))+'</textarea></label><button class="b primary" id="saves">Save settings</button>';$('#saves').onclick=async()=>{try{const settings=JSON.parse($('#sj').value),allowed=['email','phone','whatsapp','social','bank','donateLink','formspree','hero','giscus','stats','gallery','team','turnstileSiteKey'];if(!settings||typeof settings!=='object'||Array.isArray(settings))throw Error('Settings must be a JSON object.');if(Object.keys(settings).some(k=>!allowed.includes(k)))throw Error('Unknown settings field. Only approved public website fields can be saved.');if(JSON.stringify(settings).length>100000)throw Error('Settings are too large.');const {error}=await db.from('site_settings').upsert({id:1,settings,updated_at:new Date().toISOString()});if(error)throw error;say('Settings saved.')}catch(e){say('Could not save: '+e.message)}}}
async function loadDonations(){const {data,error}=await db.from('donations').select('*').order('donation_date',{ascending:false});if(error)throw error;$('#donations').innerHTML='<h2>Donation register</h2><form id="df" class="grid"><label>Donor/reference<input name="donor"></label><label>Amount (NGN)<input name="amount" type="number" min="1" step=".01" required></label><label>Date<input name="date" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></label><label>Method<input name="method"></label><label>Note<input name="note"></label><div style="align-self:end"><button class="b primary">Record donation</button></div></form><h3>Records</h3>'+data.map(d=>'<div class="item bar"><span><b>₦'+Number(d.amount).toLocaleString()+'</b> · '+esc(d.donor)+'<br><small class="muted">'+esc(d.donation_date)+' · '+esc(d.method)+' · '+esc(d.note)+'</small></span><button class="b danger" data-rmd="'+d.id+'">Delete</button></div>').join('')+'<p><b>Total recorded: ₦'+data.reduce((n,d)=>n+Number(d.amount),0).toLocaleString()+'</b></p>';$('#df').onsubmit=async e=>{e.preventDefault();const x=new FormData(e.target),{error}=await db.from('donations').insert({donor:x.get('donor'),amount:Number(x.get('amount')),donation_date:x.get('date'),method:x.get('method'),note:x.get('note')});if(error)say(error.message);else loadDonations()};$('#donations').querySelectorAll('[data-rmd]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this donation?')){const {error}=await db.from('donations').delete().eq('id',b.dataset.rmd);if(error)say(error.message);else loadDonations()}})}
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){$('#workspace').classList.add('hidden');$('#login').classList.remove('hidden');$('#userbox').innerHTML='';say('Your admin session has ended. Please sign in again.')}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));$('#loginform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);say('Signing in…');const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){say(error.message);return}db.rpc('record_admin_auth_event',{p_action:'login'}).then(({error})=>{if(error)console.warn('Login audit event could not be saved.')}).catch(()=>console.warn('Login audit event could not be saved.'));try{await enter()}catch(x){say(x.message)}};(async()=>{const {data:{session}}=await db.auth.getSession();if(session)try{await enter()}catch(e){say(e.message)}})();
