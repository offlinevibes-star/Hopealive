async function expandMediaSelection(selected){const out=[];let total=0;for(const picked of selected){if(!picked.name.toLowerCase().endsWith('.zip')&&picked.type!=='application/zip'&&picked.type!=='application/x-zip-compressed'){out.push(picked);continue}if(!window.JSZip)throw Error('ZIP support did not load. Refresh the page and try again.');const archive=await JSZip.loadAsync(picked);const entries=Object.values(archive.files).filter(x=>{if(x.dir)return false;const parts=x.name.split('/');if(parts.some(part=>part.startsWith('.')||part==='__MACOSX'))return false;return ['jpg','jpeg','png','webp','gif','mp4','webm','mov'].includes((parts[parts.length-1].split('.').pop()||'').toLowerCase())});for(const entry of entries){const ext=entry.name.split('.').pop().toLowerCase(),mime=({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime'})[ext];const size=entry._data&&entry._data.uncompressedSize||0;if(size>MAX_MEDIA_BYTES)throw Error(entry.name+' exceeds the 50 MB per-file limit.');total+=size;if(total>300*1024*1024)throw Error('This ZIP expands beyond the 300 MB batch limit.');const blob=await entry.async('blob');out.push(new File([blob],entry.name.split('/').pop(),{type:mime,lastModified:Date.now()}));if(out.length>250)throw Error('This batch contains more than 250 media files.')}}return out}async function uploadToStorage(file,category,bucket=MEDIA_BUCKET){if(!['image/jpeg','image/png','image/webp','image/gif','video/mp4','video/webm','video/quicktime'].includes(file.type))throw Error('Unsupported file type. Use JPEG, PNG, WebP, GIF, MP4, WebM or MOV: '+file.name);if(file.size>MAX_MEDIA_BYTES)throw Error(file.name+' is larger than 50 MB. Please compress it before uploading.');const ext=(file.name.split('.').pop()||'file').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8)||'file';const folder=String(category||'media').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'media';const path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,10)+'.'+ext;const {data,error}=await db.storage.from(bucket).upload(path,file,{cacheControl:'31536000',contentType:file.type,upsert:false});if(error)throw error;const url=bucket===MEDIA_BUCKET?db.storage.from(bucket).getPublicUrl(data.path).data.publicUrl:null;return {bucket,path,url,type:file.type.startsWith('video/')?'video':'image',mime_type:file.type,size_bytes:file.size,filename:file.name}}

async function loadPosts(){const {data,error}=await db.from('posts').select('*').order('published_at',{ascending:false});if(error)throw error;postRows=data;$('#posts').innerHTML='<div class="bar"><h2>Blog posts</h2><button class="b primary" id="newpost">New post</button></div><div id="plist">'+data.map(p=>'<div class="item bar"><span><b>'+esc(p.title)+'</b><br><small class="muted">'+(p.is_draft?'Draft':'Published')+' · '+esc(p.published_at||'')+'</small></span><span><button class="b" data-edit="'+p.id+'">Edit</button> <button class="b danger" data-rmp="'+p.id+'">Delete</button></span></div>').join('')+'</div><div id="pform" class="hidden"></div>';$('#newpost').onclick=()=>editPost(null);$('#posts').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPost(postRows.find(p=>p.id===b.dataset.edit)));$('#posts').querySelectorAll('[data-rmp]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this post and its uploaded attachments?')){const post=postRows.find(p=>p.id===b.dataset.rmp),{error}=await db.from('posts').delete().eq('id',b.dataset.rmp);if(error){say(error.message);return}for(const item of (post&&Array.isArray(post.media)?post.media:[]))if(item.path){try{await hopeCleanupDetachedObject(item.bucket||MEDIA_BUCKET,item.path)}catch(cleanupError){say('Post deleted; attachment cleanup is pending: '+cleanupError.message)}}say('Post and attachments deleted.');loadPosts()}})}

iew h3{font-size:18px;margin:12px 0}.sf-live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#42a66c;margin-right:7px}.sf-help{font-size:13px}.sf-help ol{padding-left:20px;line-height:1.8}.sf-save,.sf-reset{width:100%;margin:5px 0}.sf-save-note{font-size:12px;text-align:center}.sf-dirty{color:#8a5b00!important;font-weight:700}@media(max-width:850px){.sf-layout{grid-template-columns:1fr}.sf-side{position:static;display:grid;grid-template-columns:1fr 1fr;gap:10px}.sf-side>*{margin:0}.sf-side .sf-save,.sf-side .sf-reset,.sf-side .sf-save-note{grid-column:1/-1}}@media(max-width:560px){.sf-fields,.sf-side{grid-template-columns:1fr}.sf-section{padding:13px}.sf-head{align-items:flex-start}}';root.appendChild(style);
const updatePreview=()=>{const e=$('#sf-preview-title');if(e)e.textContent=model.team?.[0]?.n||'HopeAlive Foundation';$('#sf-preview-email').textContent=model.email||'Add your public email';$('#sf-preview-phone').textContent=model.phone||'Add a phone number';$('#sf-preview-donate').textContent=model.donateLink?'Donation link added':'No donation link yet'};

const bindArrayControls=key=>{
const section=root.querySelector('[data-array-section="'+key+'"]');if(!section)return;

};
const refreshArray=key=>{const section=root.querySelector('[data-array-section="'+key+'"]');if(!section)return;const title=section.querySelector('h3').textContent;const config=key==='stats'?[{label:'Number or figure',key:'n'},{label:'Description',key:'l'}]:key==='gallery'?[{label:'Image or video URL',key:'src',type:'url',help:'Use a direct image/video link.'},{label:'Display name',key:'cap'},{label:'Description',key:'description',type:'textarea'},{label:'Accessible image description (alt text)',key:'alt'},{label:'Category',key:'category'},{label:'Media type (image or video)',key:'type',help:'Enter image or video.'}]:[{label:'Full name',key:'n'},{label:'Role or title',key:'r'},{label:'Profile photo URL',key:'p',type:'url'},{label:'Short biography',key:'b',type:'textarea'}];section.outerHTML=arrayEditor(title,key,config,{});bindArrayControls(key);};

$('#saves').onclick=async()=>{try{const allowed=['email','phone','whatsapp','social','bank','donateLink','formspree','hero','giscus','stats','gallery','team','turnstileSiteKey','content'];if(!model||typeof model!=='object'||Array.isArray(model))throw Error('Settings data is invalid.');if(Object.keys(model).some(k=>!allowed.includes(k)))throw Error('Unsupported settings were found. Please reload and try again.');if(JSON.stringify(model).length>100000)throw Error('Settings are too large.');if(model.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(model.email))throw Error('Please enter a valid public email address.');const checkUrl=(value,label)=>{if(!value)return;if(/^\s*javascript:/i.test(value)||/^\s*data:/i.test(value))throw Error(label+' must be a safe website URL.');try{const u=new URL(value,location.origin);if(!['http:','https:'].includes(u.protocol))throw Error()}catch(_){throw Error(label+' must be a valid http or https URL.')}};[['Homepage image',model.hero],['Donation link',model.donateLink],...Object.entries(model.social||{}).map(([k,v])=>[k,v]),...(model.gallery||[]).map((v,i)=>['Gallery item '+(i+1),v.src]),...(model.team||[]).map((v,i)=>['Team photo '+(i+1),v.p])].forEach(([label,value])=>checkUrl(value,label));for(const [i,item] of (model.gallery||[]).entries()){if(item.type&&!['image','video'].includes(item.type.toLowerCase()))throw Error('Gallery item '+(i+1)+' type must be image or video.');item.type=(item.type||'image').toLowerCase();if(item.src&&item.src.length>2000)throw Error('Gallery URL is too long.')}if((model.gallery||[]).some(x=>!x.src))throw Error('Every gallery item needs a media URL, or remove the empty item.');if(JSON.stringify(model).length>100000)throw Error('Settings are too large.');const {error}=await db.from('site_settings').upsert({id:1,settings:model,updated_at:new Date().toISOString()});if(error)throw error;say('Settings saved successfully. Your public website will show the changes when refreshed.');$('#status').classList.remove('sf-dirty');$('#saves').textContent='Saved';setTimeout(()=>{const b=$('#saves');if(b)b.textContent='Save changes'},1800)}catch(e){say('Could not save: '+e.message);$('#status').classList.add('sf-dirty')}};
updatePreview();
}
async function loadDonations(){const {data,error}=await db.from('donations').select('*').order('donation_date',{ascending:false});if(error)throw error;$('#donations').innerHTML='<h2>Donation register</h2><form id="df" class="grid"><label>Donor/reference<input name="donor"></label><label>Amount (NGN)<input name="amount" type="number" min="1" step=".01" required></label><label>Date<input name="date" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></label><label>Method<input name="method"></label><label>Note<input name="note"></label><div style="align-self:end"><button class="b primary">Record donation</button></div></form><h3>Records</h3>'+data.map(d=>'<div class="item bar"><span><b>₦'+Number(d.amount).toLocaleString()+'</b> · '+esc(d.donor)+'<br><small class="muted">'+esc(d.donation_date)+' · '+esc(d.method)+' · '+esc(d.note)+'</small></span><button class="b danger" data-rmd="'+d.id+'">Delete</button></div>').join('')+'<p><b>Total recorded: ₦'+data.reduce((n,d)=>n+Number(d.amount),0).toLocaleString()+'</b></p>';$('#df').onsubmit=async e=>{e.preventDefault();const x=new FormData(e.target),{error}=await db.from('donations').insert({donor:x.get('donor'),amount:Number(x.get('amount')),donation_date:x.get('date'),method:x.get('method'),note:x.get('note')});if(error)say(error.message);else loadDonations()};$('#donations').querySelectorAll('[data-rmd]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this donation?')){const {error}=await db.from('donations').delete().eq('id',b.dataset.rmd);if(error)say(error.message);else loadDonations()}})}
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){$('#workspace').classList.add('hidden');$('#login').classList.remove('hidden');$('#userbox').innerHTML='';say('Your admin session has ended. Please sign in again.')}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));$('#loginform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);say('Signing in…');const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){say(error.message);return}db.rpc('record_admin_auth_event',{p_action:'login'}).then(({error})=>{if(error)console.warn('Login audit event could not be saved.')}).catch(()=>console.warn('Login audit event could not be saved.'));try{await enter()}catch(x){say(x.message)}};(async()=>{const {data:{session}}=await db.auth.getSession();if(session)try{await enter()}catch(e){say(e.message)}})();
