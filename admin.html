<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>HopeAlive Admin</title><link rel="stylesheet" href="style.css"><style>
body{background:var(--mist)}.ad{max-width:1100px;margin:auto;padding:22px}.panel{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:20px;margin:16px 0}.bar,.tabs,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tabs{justify-content:flex-start;margin:18px 0}.b{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:99px;padding:9px 17px;background:#fff;color:var(--ink);cursor:pointer}.primary{background:var(--sun)}.danger{color:#b22}.active{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:grid;gap:5px;margin:8px 0}input,textarea{width:100%;padding:10px;border:1px solid #aaa;border-radius:8px;font:inherit}textarea{min-height:110px}.item{padding:14px 0;border-top:1px solid #ddd}.muted{color:#555;font-size:14px}.hidden{display:none!important}.status{font-weight:700;min-height:24px}@media(max-width:600px){.ad{padding:12px}.panel{padding:14px}}
</style></head><body><main class="ad"><div class="bar"><div><h1 style="font-size:34px">HopeAlive Admin</h1><p class="muted">Secure administration</p></div><div id="userbox"></div></div><p id="status" class="status" role="status"></p><section id="login" class="panel"><h2>Administrator sign in</h2><p class="muted">Use the email address invited in Supabase Authentication.</p><form id="loginform"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="b primary">Sign in</button></form><p class="muted" style="margin-top:14px"><a href="forgot-password.html">Forgot your password?</a></p></section><section id="workspace" class="hidden"><nav class="tabs"><button class="b active" data-tab="messages">Messages</button><button class="b" data-tab="posts">Posts</button><button class="b" data-tab="settings">Settings</button><button class="b" data-tab="donations">Donations</button></nav><div id="messages" class="panel"></div><div id="posts" class="panel hidden"></div><div id="settings" class="panel hidden"></div><div id="donations" class="panel hidden"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://thnrxtxhkmfqnoooqcwc.supabase.co','sb_publishable_9Rdbl86dfIb00Z32M5VOEQ_gjqRODYk'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),say=t=>$('#status').textContent=t;
let tab='messages',postRows=[];
async function authCheck(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.rpc('is_hopealive_admin');if(error)throw error;return data===true}
async function enter(){if(!await authCheck()){await db.auth.signOut();throw Error('This account is not authorised in the HopeAlive admin allow-list.')}$('#login').classList.add('hidden');$('#workspace').classList.remove('hidden');$('#userbox').innerHTML='<a class="b" href="supabase-migrate.html">Import old website data</a> <button class="b" id="logout">Sign out</button>';$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};show('messages')}
function show(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));['messages','posts','settings','donations'].forEach(k=>$('#'+k).classList.toggle('hidden',k!==t));load(t)}
async function load(t){say('Loading…');try{if(t==='messages')await loadMessages();if(t==='posts')await loadPosts();if(t==='settings')await loadSettings();if(t==='donations')await loadDonations();say('')}catch(e){say('Error: '+e.message)}}
async function loadMessages(){const {data,error}=await db.from('contact_messages').select('*').order('created_at',{ascending:false});if(error)throw error;$('#messages').innerHTML='<h2>Contact messages ('+data.length+')</h2>'+(data.map(m=>'<article class="item"><div class="bar"><b>'+esc(m.sender_name)+'</b><span class="muted">'+new Date(m.created_at).toLocaleString()+'</span></div><p><a href="mailto:'+esc(m.sender_email)+'">'+esc(m.sender_email)+'</a></p><p style="white-space:pre-wrap">'+esc(m.message)+'</p><button class="b" data-read="'+m.id+'">'+(m.is_read?'Read':'Mark as read')+'</button> <button class="b danger" data-delmsg="'+m.id+'">Delete</button></article>').join('')||'<p>No messages yet.</p>');$('#messages').querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{const {error}=await db.from('contact_messages').update({is_read:true}).eq('id',b.dataset.read);if(error)say(error.message);else loadMessages()});$('#messages').querySelectorAll('[data-delmsg]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this message?')){const {error}=await db.from('contact_messages').delete().eq('id',b.dataset.delmsg);if(error)say(error.message);else loadMessages()}})}
async function loadPosts(){const {data,error}=await db.from('posts').select('*').order('published_at',{ascending:false});if(error)throw error;postRows=data;$('#posts').innerHTML='<div class="bar"><h2>Blog posts</h2><button class="b primary" id="newpost">New post</button></div><div id="plist">'+data.map(p=>'<div class="item bar"><span><b>'+esc(p.title)+'</b><br><small class="muted">'+(p.is_draft?'Draft':'Published')+' · '+esc(p.published_at||'')+'</small></span><span><button class="b" data-edit="'+p.id+'">Edit</button> <button class="b danger" data-rmp="'+p.id+'">Delete</button></span></div>').join('')+'</div><div id="pform" class="hidden"></div>';$('#newpost').onclick=()=>editPost(null);$('#posts').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPost(postRows.find(p=>p.id===b.dataset.edit)));$('#posts').querySelectorAll('[data-rmp]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this post?')){const {error}=await db.from('posts').delete().eq('id',b.dataset.rmp);if(error)say(error.message);else loadPosts()}})}
function editPost(p){const f=$('#pform');f.classList.remove('hidden');f.innerHTML='<h3>'+(p?'Edit post':'New post')+'</h3><form id="pf"><div class="grid"><label>Title<input name="title" required value="'+esc(p?.title||'')+'"></label><label>Slug<input name="slug" required value="'+esc(p?.slug||'')+'"></label><label>Date<input name="date" type="date" value="'+esc(p?.published_at||new Date().toISOString().slice(0,10))+'"></label><label>Category<input name="category" value="'+esc(p?.category||'News')+'"></label><label>Author<input name="author" value="'+esc(p?.author||'HopeAlive Foundation')+'"></label><label>Image URL<input name="image" value="'+esc(p?.featured_image||'')+'"></label></div><label>Excerpt<textarea name="excerpt">'+esc(p?.excerpt||'')+'</textarea></label><label>Tags, separated by commas<input name="tags" value="'+esc((p?.tags||[]).join(', '))+'"></label><label>Body HTML<textarea name="body">'+esc(p?.body_html||'')+'</textarea></label><label><span><input type="checkbox" name="draft" style="width:auto" '+(p?.is_draft?'checked':'')+'> Save as draft</span></label><button class="b primary">Save</button> <button type="button" class="b" id="cancelp">Cancel</button></form>';$('#cancelp').onclick=()=>f.classList.add('hidden');$('#pf').onsubmit=async e=>{e.preventDefault();const x=new FormData(e.target),row={title:x.get('title').trim(),slug:x.get('slug').trim().toLowerCase(),published_at:x.get('date')||null,category:x.get('category').trim()||'News',author:x.get('author').trim()||'HopeAlive Foundation',featured_image:x.get('image').trim(),excerpt:x.get('excerpt').trim(),tags:x.get('tags').split(',').map(v=>v.trim()).filter(Boolean),body_html:x.get('body'),is_draft:x.has('draft'),updated_at:new Date().toISOString()};const q=p?db.from('posts').update(row).eq('id',p.id):db.from('posts').insert(row);const {error}=await q;if(error)say(error.message);else{say('Post saved.');loadPosts()}}}
async function loadSettings(){const {data,error}=await db.from('site_settings').select('settings').eq('id',1).single();if(error)throw error;$('#settings').innerHTML='<h2>Website settings</h2><p class="muted">Edit the full settings JSON. Keep its structure and only change verified details.</p><label>Settings JSON<textarea id="sj" style="min-height:400px;font-family:monospace">'+esc(JSON.stringify(data.settings||{},null,2))+'</textarea></label><button class="b primary" id="saves">Save settings</button>';$('#saves').onclick=async()=>{try{const settings=JSON.parse($('#sj').value),{error}=await db.from('site_settings').upsert({id:1,settings,updated_at:new Date().toISOString()});if(error)throw error;say('Settings saved.')}catch(e){say('Could not save: '+e.message)}}}
async function loadDonations(){const {data,error}=await db.from('donations').select('*').order('donation_date',{ascending:false});if(error)throw error;$('#donations').innerHTML='<h2>Donation register</h2><form id="df" class="grid"><label>Donor/reference<input name="donor"></label><label>Amount (NGN)<input name="amount" type="number" min="1" step=".01" required></label><label>Date<input name="date" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></label><label>Method<input name="method"></label><label>Note<input name="note"></label><div style="align-self:end"><button class="b primary">Record donation</button></div></form><h3>Records</h3>'+data.map(d=>'<div class="item bar"><span><b>₦'+Number(d.amount).toLocaleString()+'</b> · '+esc(d.donor)+'<br><small class="muted">'+esc(d.donation_date)+' · '+esc(d.method)+' · '+esc(d.note)+'</small></span><button class="b danger" data-rmd="'+d.id+'">Delete</button></div>').join('')+'<p><b>Total recorded: ₦'+data.reduce((n,d)=>n+Number(d.amount),0).toLocaleString()+'</b></p>';$('#df').onsubmit=async e=>{e.preventDefault();const x=new FormData(e.target),{error}=await db.from('donations').insert({donor:x.get('donor'),amount:Number(x.get('amount')),donation_date:x.get('date'),method:x.get('method'),note:x.get('note')});if(error)say(error.message);else loadDonations()};$('#donations').querySelectorAll('[data-rmd]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this donation?')){const {error}=await db.from('donations').delete().eq('id',b.dataset.rmd);if(error)say(error.message);else loadDonations()}})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));$('#loginform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);say('Signing in…');const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){say(error.message);return}try{await enter()}catch(x){say(x.message)}};(async()=>{const {data:{session}}=await db.auth.getSession();if(session)try{await enter()}catch(e){say(e.message)}})();
</script></body></html>
