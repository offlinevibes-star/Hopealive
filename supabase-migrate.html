<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>HopeAlive data migration</title><link rel="stylesheet" href="style.css"></head><body><main style="max-width:760px;margin:40px auto;padding:20px"><h1>HopeAlive data migration</h1><p>Sign in to the admin dashboard first, then use this one-time tool to copy existing posts, settings and donation records into Supabase.</p><button id="go" class="btn">Import existing website data</button><p id="status" role="status"></p><p><a href="admin.html">Admin dashboard</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://thnrxtxhkmfqnoooqcwc.supabase.co','sb_publishable_9Rdbl86dfIb00Z32M5VOEQ_gjqRODYk'),status=t=>document.querySelector('#status').textContent=t;
async function get(p){const r=await fetch(p+'?v='+Date.now());if(!r.ok)throw Error('Could not read '+p);return r.json()}
document.querySelector('#go').onclick=async()=>{try{status('Checking admin access…');const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Please sign in at admin.html first.');const {data:ok,error}=await db.rpc('is_hopealive_admin');if(error)throw error;if(!ok)throw Error('Your account is not authorised.');status('Importing existing content…');const [ps,st,ds]=await Promise.all([get('data/posts.json'),get('data/settings.json'),get('data/donations.json').catch(()=>[])]);const rows=ps.map(p=>({slug:p.slug,title:p.title,excerpt:p.excerpt||'',body_html:p.body||'',category:p.cat||p.tag||'News',tags:p.tags||[],author:p.author||'HopeAlive Foundation',featured_image:p.img||'',published_at:p.date||null,is_draft:!!p.draft}));if(rows.length){const {error}=await db.from('posts').upsert(rows,{onConflict:'slug'});if(error)throw error}const {error:se}=await db.from('site_settings').upsert({id:1,settings:st},{onConflict:'id'});if(se)throw se;const valid=[];for(let i=0;i<ds.length;i++){const d=ds[i];if(!(Number(d.amount)>0&&d.date))continue;const raw=JSON.stringify({index:i,donor:d.donor||'',amount:Number(d.amount),date:d.date,method:d.method||'',note:d.note||''});const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));const source_key='legacy-json:'+Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');valid.push({source_key,donor:d.donor||'',amount:Number(d.amount),donation_date:d.date,method:d.method||'',note:d.note||''})}if(valid.length){const {error}=await db.from('donations').upsert(valid,{onConflict:'source_key'});if(error)throw error}status('Imported or updated '+rows.length+' posts, site settings and '+valid.length+' legacy donation rows. Re-running this import will update the same legacy donation rows rather than duplicate them.')}catch(e){status('Import failed: '+e.message)}};
</script></body></html>
