<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a New Password | HopeAlive</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: Arial, sans-serif; background: #f3f6f4; }
    .card { width: min(100%, 410px); padding: 30px; background: #fff; border-radius: 14px; box-shadow: 0 8px 30px #00000012; }
    h1 { margin-top: 0; color: #176b45; font-size: 25px; }
    p { color: #4b5563; line-height: 1.5; }
    input, button { width: 100%; padding: 13px; margin-top: 12px; border-radius: 7px; font-size: 16px; }
    input { border: 1px solid #cbd5d1; }
    button { border: 0; color: white; background: #176b45; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { overflow-wrap: anywhere; }
    a { color: #176b45; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Create a new password</h1>
    <p>Open this page using the password-recovery link sent by Supabase. Choose a password with at least 8 characters.</p>
    <form id="passwordForm">
      <input id="password" type="password" placeholder="New password" minlength="8" autocomplete="new-password" required>
      <input id="confirmPassword" type="password" placeholder="Confirm new password" minlength="8" autocomplete="new-password" required>
      <button id="submitBtn" type="submit">Update password</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="admin.html">Return to admin login</a></p>
  </main>
  <script>
    const SUPABASE_URL = "https://thnrxtxhkmfqnoooqcwc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9Rdbl86dfIb00Z32M5VOEQ_gjqRODYk";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const form = document.getElementById("passwordForm");
    const button = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    let recoveryReady = false;

    db.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryReady = true;
        message.textContent = "Recovery link verified. You can now choose a new password.";
      }
    });

    async function checkRecoverySession() {
      const { data, error } = await db.auth.getSession();
      if (error) {
        message.textContent = error.message;
        return;
      }
      if (data.session) {
        recoveryReady = true;
        message.textContent = "Recovery session found. You can now choose a new password.";
      } else {
        message.textContent = "No valid recovery session found. Please open this page from a fresh password-reset email link.";
      }
    }
    checkRecoverySession();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmPassword").value;
      if (password.length < 8) {
        message.textContent = "Use at least 8 characters.";
        return;
      }
      if (password !== confirmation) {
        message.textContent = "The passwords do not match.";
        return;
      }
      if (!recoveryReady) {
        message.textContent = "Please open this page using a valid recovery link from your email.";
        return;
      }
      button.disabled = true;
      button.textContent = "Updating...";
      try {
        const { error } = await db.auth.updateUser({ password });
        if (error) throw error;
        message.textContent = "Your password has been updated. You can now sign in to the admin dashboard.";
        await db.auth.signOut();
        form.reset();
      } catch (error) {
        message.textContent = "Password update failed: " + (error.message || "Please request a new recovery link.");
      } finally {
        button.disabled = false;
        button.textContent = "Update password";
      }
    });
  </script>
</body>
</html>
