name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check whitespace and patch integrity
        run: git diff --check
      - name: Check public site JavaScript syntax
        run: node --check site.js
      - name: Run admin settings UI regression test
        run: node --test tests/admin-settings-ui.test.mjs
      - name: Run full test suite
        run: npm test
